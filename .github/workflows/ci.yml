name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - "release/**"
      - main
      - master
  push:
    branches:
      - "codex/**"
      - develop
      - "release/**"
      - main
      - master

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, package and container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Enable Maven Wrapper
        run: chmod +x mvnw

      - name: Test and package
        run: ./mvnw -B -ntp clean verify

      - name: Repeat test suite twice to detect flakiness
        run: |
          ./mvnw -B -ntp test
          ./mvnw -B -ntp test

      - name: Mutation testing for domain logic
        run: ./mvnw -B -ntp -Pmutation org.pitest:pitest-maven:mutationCoverage

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-mutation-evidence
          path: target/pit-reports/
          if-no-files-found: ignore

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan filesystem dependencies and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Build container without publishing
        run: docker build --tag desarrolloappsii-back:${GITHUB_SHA} .
