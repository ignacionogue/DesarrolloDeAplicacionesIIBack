spring.application.name=demo

# En tests usamos H2 en memoria para no depender de una instancia de Postgres
# corriendo en la maquina que ejecuta los tests (CI, otros integrantes, etc.).
# La app en runtime (main) sigue usando Postgres definido en application.properties.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.cors.allowed-origins=http://localhost:3000
