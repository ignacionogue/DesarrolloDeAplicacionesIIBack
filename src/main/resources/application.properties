spring.application.name=obras-publicas-backend
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.auth.jwt-secret=${JWT_SECRET}
app.auth.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.auth.username=${AUTH_USERNAME:}
app.auth.password=${AUTH_PASSWORD:}
app.auth.role=${AUTH_ROLE:PERSONAL_OBRAS}
app.auth.bootstrap-users=${AUTH_BOOTSTRAP_USERS:[]}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Disabled unless explicitly configured. Core owns exchange/queue/bindings.
app.messaging.enabled=${MESSAGING_ENABLED:false}
app.messaging.m6-uuid-contract-confirmed=${M6_UUID_CONTRACT_CONFIRMED:false}
app.messaging.m7-uuid-contract-confirmed=${M7_UUID_CONTRACT_CONFIRMED:false}
app.messaging.m7-accident-uuid-required=${M7_ACCIDENT_UUID_REQUIRED:false}
app.messaging.host=${RABBITMQ_HOST:core-uade-2026.duckdns.org}
app.messaging.port=${RABBITMQ_PORT:5671}
app.messaging.username=${RABBITMQ_USERNAME:module_obras}
app.messaging.password=${RABBITMQ_PASSWORD:}
app.messaging.vhost=${RABBITMQ_VHOST:core}
app.messaging.tls=${RABBITMQ_TLS_ENABLED:true}
app.messaging.exchange=${CORE_EXCHANGE:muni.inbox}
app.messaging.queue=${CORE_QUEUE:q.obras}
app.core.base-url=${CORE_BASE_URL:}
app.core.module-name=${CORE_MODULE_NAME:obras}
app.core.machine-secret=${CORE_MACHINE_SECRET:}
